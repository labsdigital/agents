<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="1">PIRAMIDA PENDIDIKAN AI</text>
  <text x="400" y="66" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="0.5">Dari Transfer Pengetahuan hingga Kehadiran Manusiawi</text>

  <!-- Pyramid Layers -->
  <!-- Layer 4 (Top) - Kehadiran Manusiawi -->
  <polygon points="400,90 310,170 490,170" fill="url(#orange)" opacity="0.9" filter="url(#glow)"/>
  <text x="400" y="138" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">KEHADIRAN MANUSIAWI</text>
  <text x="400" y="155" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">Diskusi · Perdebatan · Empati</text>

  <!-- Layer 3 -->
  <polygon points="280,180 520,180 490,260 310,260" fill="url(#purple)" opacity="0.85"/>
  <text x="400" y="218" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">GESekan INTELEKTUAL</text>
  <text x="400" y="236" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">Konflik pandangan · Dialog bebas · Ketidaknyamanan</text>
  <text x="400" y="254" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9">Tidak terukur · Tidak efisien · Esensial</text>

  <!-- Layer 2 -->
  <polygon points="240,270 560,270 520,350 280,350" fill="url(#cyan)" opacity="0.8"/>
  <text x="400" y="305" text-anchor="middle" fill="#0d1117" font-size="14" font-weight="600">AI TUTOR PERSONAL</text>
  <text x="400" y="323" text-anchor="middle" fill="rgba(13,17,23,0.7)" font-size="10">Personalisasi · Adaptif · Efisien</text>
  <text x="400" y="341" text-anchor="middle" fill="rgba(13,17,23,0.5)" font-size="9">Terukur · Terprediksi · Tanpa gesekan</text>

  <!-- Layer 1 (Bottom) -->
  <polygon points="180,360 620,360 560,440 240,440" fill="#30363d" opacity="0.9"/>
  <text x="400" y="395" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600">TRANSFER PENGETAHUAN</text>
  <text x="400" y="415" text-anchor="middle" fill="#6e7681" font-size="10">Fakta · Rumus · Hapalan</text>
  <text x="400" y="433" text-anchor="middle" fill="#484f58" font-size="9">Bankir model · Passif · Definisi</text>

  <!-- Side annotations -->
  <line x1="630" y1="130" x2="720" y2="130" stroke="#f5576c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="725" y="126" fill="#f5576c" font-size="10" font-weight="600">Paling mahal</text>
  <text x="725" y="140" fill="#8b949e" font-size="9">tapi paling bernilai</text>

  <line x1="630" y1="220" x2="720" y2="220" stroke="#667eea" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="725" y="216" fill="#667eea" font-size="10" font-weight="600">Jembatan</text>
  <text x="725" y="230" fill="#8b949e" font-size="9">antara mesin &amp; manusia</text>

  <line x1="630" y1="310" x2="720" y2="310" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="725" y="306" fill="#4facfe" font-size="10" font-weight="600">Efisien tapi kosong</text>
  <text x="725" y="320" fill="#8b949e" font-size="9">tanpa dimensi sosial</text>

  <line x1="630" y1="400" x2="720" y2="400" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="725" y="396" fill="#6e7681" font-size="10" font-weight="600">Paling dasar</text>
  <text x="725" y="410" fill="#484f58" font-size="9">fondasi tapi bukan tujuan</text>

  <!-- Left side arrow -->
  <path d="M 60,200 L 60,350" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="45" y="210" text-anchor="middle" fill="#8b949e" font-size="10" transform="rotate(-90,45,210)">DERAJAT KEMANUSIAWIAN</text>

  <!-- Bottom legend -->
  <rect x="250" y="460" width="12" height="12" rx="2" fill="url(#orange)"/>
  <text x="268" y="471" fill="#e6edf3" font-size="10">Kehadiran</text>
  <rect x="360" y="460" width="12" height="12" rx="2" fill="url(#purple)"/>
  <text x="378" y="471" fill="#e6edf3" font-size="10">Gesekan</text>
  <rect x="450" y="460" width="12" height="12" rx="2" fill="url(#cyan)"/>
  <text x="468" y="471" fill="#e6edf3" font-size="10">AI Tutor</text>
  <rect x="550" y="460" width="12" height="12" rx="2" fill="#30363d"/>
  <text x="568" y="471" fill="#e6edf3" font-size="10">Transfer</text>
</svg>
</div>

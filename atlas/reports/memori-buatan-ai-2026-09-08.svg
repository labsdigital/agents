<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Memori Buatan AI: Bagaimana Mesin Mengemas Ingatan Manusia</title>
  <desc id="desc">Diagram yang memperlihatkan transformasi memori manusia menjadi data digital yang dikemas dan disimpan oleh kecerdasan buatan.</desc>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0f0f23"/>
  
  <!-- Header -->
  <text x="400" y="40" text-anchor="middle" fill="#f97316" font-size="22" font-weight="bold" font-family="Inter, sans-serif">Memori Buatan AI</text>
  
  <!-- Flow diagram -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Stage 1: Human Memory -->
  <circle cx="120" cy="280" r="80" fill="url(#grad1)" opacity="0.9" filter="url(#glow)"/>
  <text x="120" y="265" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">MEMORI</text>
  <text x="120" y="285" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">MANUSIA</text>
  <text x="120" y="310" text-anchor="middle" fill="#fbbf24" font-size="11">Neural patterns</text>
  <text x="120" y="325" text-anchor="middle" fill="#fbbf24" font-size="11">Emotions & senses</text>
  
  <!-- Arrow 1 -->
  <path d="M 210 280 L 270 280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">Capture</text>
  
  <!-- Stage 2: Data Conversion -->
  <rect x="280" y="230" width="140" height="100" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="350" y="260" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">DIALOG</text>
  <text x="350" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">Transcript</text>
  <text x="350" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">Photos</text>
  <text x="350" y="310" text-anchor="middle" fill="#94a3b8" font-size="10">Videos</text>
  
  <!-- Arrow 2 -->
  <path d="M 430 280 L 490 280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">Train</text>
  
  <!-- Stage 3: AI Model -->
  <polygon points="530,230 610,280 530,330" fill="url(#grad2)" opacity="0.9" filter="url(#glow)"/>
  <text x="570" y="275" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">AI</text>
  <text x="570" y="295" text-anchor="middle" fill="#bfdbfe" font-size="10">Model</text>
  
  <!-- Arrow 3 -->
  <path d="M 610 280 L 670 280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">Serve</text>
  
  <!-- Stage 4: Digital Immortality -->
  <circle cx="720" cy="280" r="60" fill="#1e293b" stroke="#f97316" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="720" y="275" text-anchor="middle" fill="#f97316" font-size="11" font-weight="bold">ABADI</text>
  <text x="720" y="295" text-anchor="middle" fill="#fbbf24" font-size="9">Digital</text>
  
  <!-- Bottom insight box -->
  <rect x="100" y="400" width="600" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="430" text-anchor="middle" fill="#f97316" font-size="13" font-weight="bold">Paradoks Memori Digital</text>
  <text x="130" y="460" fill="#e2e8f0" font-size="11">• Memori manusia: subjektif, emosional, berubah</text>
  <text x="130" y="480" fill="#e2e8f0" font-size="11">• Memori digital: objektif, statis, abadi</text>
  <text x="130" y="500" fill="#e2e8f0" font-size="11">• Hasil: keabadian tanpa kehidupan</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="100" r="3" fill="#f97316" opacity="0.3"/>
  <circle cx="750" cy="100" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="50" cy="500" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="750" cy="500" r="3" fill="#f97316" opacity="0.3"/>
</svg>